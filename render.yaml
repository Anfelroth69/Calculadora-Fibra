# Render Blueprint — plan free (un solo Web Service: Astro SSR + Hono API)
# El runtime "node" de Render incluye Bun de forma nativa (bun.lock presente lo activa).
services:
  - type: web
    name: calculadora-fibra
    runtime: node
    plan: free
    # Bun disponible en build y runtime. Versiona para builds reproducibles:
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    healthCheckPath: /api/prices
    autoDeploy: true
    envVars:
      # Render inyecta PORT automáticamente; solo fijamos HOST para el adapter de Astro.
      - key: HOST
        value: 0.0.0.0
      - key: BUN_VERSION
        value: 1.3.14
      # Valores iniciales (editables luego vía /api/prices; efímeros en plan free):
      - key: PRECIO_RECTO
        value: 800000
      - key: PRECIO_CURVO
        value: 1000000
